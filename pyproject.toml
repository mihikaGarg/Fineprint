[project]
name = "fineprint"
version = "0.1.0"
description = "Compiles grant agreements into enforceable spend rules with verified clause citations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.6",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "hypothesis>=6.112",
    "pyright>=1.1.385",
    "pytest>=8.3",
    "reportlab>=4.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "shared", "compiler", "enforce", "api", "fixtures"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["contracts", "shared", "compiler", "enforce", "evals", "api"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["contracts", "shared", "compiler", "enforce", "evals", "api"]
addopts = "-q"
