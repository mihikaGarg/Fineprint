# Render Blueprint for the Fineprint API (the Python backend).
# The website in /web is deployed separately on Vercel; see docs/DEPLOY.md.
services:
  - type: web
    name: fineprint-api
    runtime: python
    plan: free
    # Editable install so the API runs from the checkout and finds fixtures/.
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # No API key here: without ANTHROPIC_API_KEY the API reads documents
      # offline. Add the key later in the Render dashboard (never in this file).
